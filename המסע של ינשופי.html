<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>המסע של ינשופי</title>
<style>
:root{
  --bg:#fbf6ec; --card:#ffffff; --ink:#1f1a14; --soft:#4f463b;
  --accent:#e08a2e; --accent2:#3d8b6e; --focus:#c0392b; --ok:#2e8b57; --try:#c96f12;
  --line:#e8dcc6; --lock:#a89d8c; --fs:1;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Arial,sans-serif;font-size:calc(22px*var(--fs));line-height:1.5}
button{font-family:inherit;font-size:1em;cursor:pointer;border:none;border-radius:16px}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff;border-bottom:2px solid var(--line);position:sticky;top:0;z-index:5}
.top h1{font-size:1.1em;margin:0;flex:1}
.small{background:#f1e7d6;color:var(--ink);padding:6px 14px;font-size:.85em}
#app{max-width:920px;margin:0 auto;padding:16px}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:22px;margin:14px 0}
.owl{font-size:3.2em;line-height:1}
.say{display:flex;gap:14px;align-items:center}
.bubble{background:#fff4e2;border:2px solid #f3d8ae;border-radius:18px;padding:12px 16px;flex:1}
.en{direction:ltr;font-family:Verdana,Arial,sans-serif;letter-spacing:.03em;word-spacing:.25em}
.focus{color:var(--focus)}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.btn{background:var(--accent);color:#fff;padding:14px 22px;font-weight:bold;min-width:120px}
.btn.alt{background:var(--accent2)}
.btn.ghost{background:#f1e7d6;color:var(--ink)}
.btn.mic{background:var(--focus);color:#fff;font-size:1.15em;padding:16px 30px}
.btn.mic.on{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.opt{background:#fff;border:3px solid var(--line);color:var(--ink);padding:14px 18px;min-width:160px}
.opt.en{font-size:1.5em}
.opt.right{border-color:var(--ok);background:#e6f5ec}
.opt.wrong{border-color:var(--try);background:#fdf0e2}
/* מילה מפורקת לצלילים */
.chunks{display:flex;direction:ltr;justify-content:center;gap:6px;margin:10px 0}
.ch{display:flex;flex-direction:column;align-items:center;min-width:1.4em}
.ch .l{font-family:Verdana,Arial,sans-serif;font-size:3.4em;font-weight:bold;line-height:1.1}
.ch .hs{font-size:.95em;color:var(--soft);direction:rtl;min-height:1.4em;font-weight:bold}
.ch.f .l,.ch.f .hs{color:var(--focus)}
.ch.silent .l{color:#9a8f80}
.ar{font-family:"Segoe UI",Tahoma,Arial;font-size:1.35em;direction:rtl;unicode-bidi:isolate;font-weight:bold}
.twin{background:#fff8d6;border:2px dashed #e0b400;border-radius:14px;padding:10px 14px;margin-top:14px;font-size:.95em}
.inp{font-size:1em;padding:10px 12px;border:3px solid var(--line);border-radius:14px;width:150px;font-family:inherit;color:var(--ink);background:#fff}
.twinrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:8px}
.arbox{background:#eef6f2;border:2px solid #cfe5da;border-radius:14px;padding:10px 14px;margin-top:12px;font-size:.95em}
.anc{background:#fff4e2;border:2px solid #f3d8ae;color:var(--ink);font-size:.85em;padding:4px 10px;border-radius:12px;font-weight:bold;white-space:nowrap}
.anc .focus,.opt .focus{color:var(--focus);text-decoration:underline;text-underline-offset:4px}
.mean{text-align:center;font-size:1.1em;color:var(--soft);min-height:1.6em}
.w{cursor:pointer;border-radius:8px;padding:0 3px}
.w:hover{background:#fff1d6}
.w.ok{background:#d7f0e0}
.w.tryw{background:#fde3c8;outline:2px solid #f0b77a}
.w.sight{border-bottom:3px dotted var(--accent2)}
.text{font-size:2em;line-height:2.1;text-align:left}
.para .s{opacity:.25;transition:.2s;display:block;padding:6px 10px;border-radius:12px}
.para .s.cur{opacity:1;background:#fff8e8;outline:3px solid #f3d8ae}
.para .s.done{opacity:.55}
.tr{color:var(--soft);font-size:.6em;direction:rtl;text-align:right;font-family:"Segoe UI",Arial;word-spacing:normal;letter-spacing:normal;line-height:1.4}
.para{font-size:1.65em;line-height:1.9}
.ladder{display:flex;direction:ltr;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;font-family:Verdana,Arial;font-size:2.4em;font-weight:bold}
.ladder .rung{padding:4px 14px;border-radius:14px;border:3px solid var(--line);opacity:.35}
.ladder .rung.cur{opacity:1;border-color:var(--accent)}
.ladder .rung.done{opacity:.8;border-color:var(--ok)}
.ladder .arr{color:var(--lock);font-size:.6em}
.progress{height:14px;background:#efe4d0;border-radius:10px;overflow:hidden;margin:6px 0 4px}
.progress div{height:100%;background:var(--accent2);transition:.3s}
.msg{min-height:1.6em;text-align:center;font-weight:bold;margin-top:12px;font-size:1.05em}
.msg.good{color:var(--ok)} .msg.soft{color:var(--try)}
.nav{display:flex;justify-content:space-between;align-items:center;margin:6px 0}
.small:disabled{opacity:.35;cursor:default}
.hud{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff;border:2px solid var(--line);border-radius:20px;padding:10px 16px;margin-bottom:10px;cursor:pointer}
.hud .pet{font-size:2.6em;line-height:1}
.hud .gp{flex:1;min-width:180px}
.pop{position:fixed;inset:0;background:rgba(40,30,20,.35);display:flex;align-items:center;justify-content:center;z-index:50}
.pop .card{max-width:520px;text-align:center;animation:popin .35s}
@keyframes popin{from{transform:scale(.6);opacity:0}}
.plus{position:fixed;top:70px;left:50%;transform:translateX(-50%);font-size:1.6em;font-weight:bold;color:#d39a00;z-index:40;animation:up 1s forwards;pointer-events:none}
@keyframes up{to{transform:translate(-50%,-50px);opacity:0}}
.confetti{position:fixed;top:-20px;font-size:1.6em;z-index:60;animation:fall 2.6s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
.gifts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.gift{width:120px;background:#fff;border:3px solid var(--line);border-radius:18px;padding:10px;text-align:center;font-size:.8em}
.gift .e{font-size:2.4em}
.gift.lock{opacity:.35}
.bounce{animation:bounce .5s 3}
@keyframes bounce{50%{transform:translateY(-18px) scale(1.08)}}
.world{margin:26px 0 8px;font-weight:bold;font-size:1.05em}
.path{display:flex;flex-wrap:wrap;gap:12px}
.node{width:132px;min-height:120px;background:#fff;border:3px solid var(--line);border-radius:20px;padding:10px;text-align:center;font-size:.8em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink)}
.node .k{font-size:1.4em;font-weight:bold;direction:ltr}
.node.open{border-color:var(--accent)}
.node.lock{color:var(--lock);cursor:default}
.node .st{color:#d39a00;font-size:1.1em;letter-spacing:2px}
.hint{color:var(--soft);font-size:.9em;text-align:center}
.legend{font-size:.85em;color:var(--soft)}
.tiny{background:none;color:var(--soft);text-decoration:underline;font-size:.85em;padding:4px}
/* ===== גן המשחקים ===== */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tile{border:3px solid rgba(0,0,0,.08);border-radius:24px;padding:16px 12px;text-align:center;color:var(--ink);font-size:.95em;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .15s}
.tile:hover{transform:translateY(-4px) rotate(-1deg)}
.tile .e{font-size:2.6em;line-height:1.1}
.tile b{font-size:1.1em}
.sis{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;width:2.2em;height:2.2em;font-size:1.6em;flex-shrink:0;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.big-en{font-family:Verdana,Arial,sans-serif;font-size:3em;font-weight:bold;direction:ltr;text-align:center;letter-spacing:.05em}
.pic{font-size:5em;text-align:center;line-height:1.2}
.blank{display:inline-block;min-width:1.1em;border-bottom:6px solid var(--accent);color:var(--focus)}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* זיכרון */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;direction:ltr}
.mcard{height:110px;border-radius:18px;font-size:1.3em;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#ffe0b8,#ffd0e0);border:3px solid #f3d8ae;color:var(--ink)}
.mcard.up{background:#fff}
.mcard.got{background:#e6f5ec;border-color:var(--ok)}
.mcard .en{font-size:1.4em;font-weight:bold}
/* בלונים */
.sky{position:relative;height:440px;overflow:hidden;border-radius:22px;background:linear-gradient(#dff1ff,#fff8ec)}
.balloon{position:absolute;bottom:-150px;width:130px;height:150px;border-radius:50% 50% 46% 46%;display:flex;align-items:center;justify-content:center;font-family:Verdana,Arial;font-weight:bold;font-size:1.5em;color:#1f1a14;border:3px solid rgba(0,0,0,.12);animation:rise linear infinite;cursor:pointer;padding:0}
.balloon:after{content:"";position:absolute;bottom:-26px;left:50%;width:2px;height:26px;background:#9a8f80}
.balloon.pop{animation:popb .35s forwards}
@keyframes rise{to{transform:translateY(-640px)}}
@keyframes popb{to{transform:scale(1.6);opacity:0}}
/* נחשים וסולמות */
.board{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(5,1fr);gap:5px;direction:ltr;max-width:620px;margin:0 auto}
.cell{aspect-ratio:1;border-radius:12px;background:#fff;border:2px solid var(--line);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.85em;font-weight:bold;color:var(--soft)}
.cell.lad{background:#e6f5ec;border-color:#9fd6b4}
.cell.snk{background:#fdeee0;border-color:#f0c79a}
.cell.goal{background:#fff4c2;border-color:#e0b400}
.cell .tok{font-size:1.9em;line-height:1}
.cell .mk{font-size:.95em;color:var(--ink)}
.die{font-size:3em;display:inline-block;min-width:1.4em;text-align:center}
/* בונים מילה */
.slots{display:flex;gap:8px;justify-content:center;direction:ltr;margin:14px 0}
.slot{min-width:70px;height:80px;border:3px dashed var(--accent);border-radius:14px;font-family:Verdana;font-size:2.2em;font-weight:bold;background:#fffaf2;color:var(--ink)}
.slot.bad{border-color:var(--try);background:#fdf0e2}
.slot.good{border-style:solid;border-color:var(--ok);background:#e6f5ec}
.ltiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;direction:ltr}
.ltile{min-width:68px;height:72px;border-radius:14px;font-family:Verdana;font-size:2em;font-weight:bold;background:#e1efff;border:3px solid #b8d4f5;color:var(--ink)}
.ltile:disabled{opacity:.25}
/* סלסלות */
.baskets{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.basket{width:240px;min-height:150px;border-radius:26px;border:4px solid #e8c48c;background:#fff6e4;padding:12px;font-size:1em;color:var(--ink)}
.basket .e{font-size:2.4em}
.basket .got{direction:ltr;font-family:Verdana;font-size:.9em;color:var(--soft);min-height:1.4em}
/* פירמידה */
.pyr{text-align:center;direction:ltr;font-family:Verdana,Arial;font-size:1.7em;line-height:1.9}
.pyr div{opacity:.3;padding:2px 10px;border-radius:12px}
.pyr div.cur{opacity:1;background:#e3f6e9;outline:3px solid #b5e0c4}
.pyr div.done{opacity:.6}
.pyr .new{color:var(--focus);text-decoration:underline;text-underline-offset:5px}
.cue{direction:ltr;font-family:Verdana,Arial;font-size:1.8em;text-align:center;line-height:2.2}
.cue span{background:#fff4e2;border:2px solid #f3d8ae;border-radius:14px;padding:4px 12px;margin:0 6px;display:inline-block}
.runs{font-size:1.05em;text-align:center}
/* מדבקות, חנות, גלגל */
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:10px}
.stk{font-size:2.6em;text-align:center;background:#fff;border:3px solid var(--line);border-radius:18px;padding:6px}
.stk.no{opacity:.25;filter:grayscale(1)}
.petwrap{position:relative;display:inline-block;line-height:1}
.petwrap .acc{position:absolute;top:-.38em;left:50%;transform:translateX(-50%);font-size:.55em}
.owlsvg{display:inline-block;vertical-align:middle;overflow:visible}
.mirror{display:inline-block;background:radial-gradient(circle,#fff8e8 55%,#fbecd0 100%);border-radius:50%;padding:18px 26px;margin:6px auto}
.wtabs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}
.wtab{background:#f6eedf;color:var(--ink);border:3px solid #e0d2b8;border-radius:14px;padding:10px 16px;font-size:1.05em;font-weight:bold;cursor:pointer}
.wtab.on{background:#fff3dc;border-color:var(--accent);box-shadow:0 3px 0 #e0a35c}
.wtab.big{font-size:1.2em;padding:12px 22px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:10px 0}
.wtile{background:#fff;border:3px solid #ddd0ba;border-radius:16px;padding:8px;cursor:pointer;color:var(--ink);font-size:1em;display:flex;flex-direction:column;align-items:center;gap:2px}
.wtile b{font-size:1.1em}
.wtile.on{border-color:var(--ok);background:#e6f5ec}
.wtile.try{border-color:var(--accent);background:#fff3dc}
.wtile.poor{opacity:.6}
.chips{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:10px 0}
.chipb{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;cursor:pointer;color:var(--ink);font-size:.95em;font-weight:bold}
.chipb .dot{width:52px;height:52px;border-radius:50%;border:3px solid #bfb39e;display:block}
.chipb.on .dot{border:5px solid #1f1a14;transform:scale(1.1)}
.trybar{background:#fff3dc;border:3px solid var(--accent);border-radius:16px;padding:12px;margin:10px 0;font-size:1.1em}
.wheel{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.wheel div{width:110px;height:90px;border-radius:18px;border:3px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:bold}
.wheel div .e{font-size:1.8em}
.wheel div.lit{background:#fff4c2;border-color:#e0b400;transform:scale(1.08)}
.breath{width:150px;height:150px;border-radius:50%;margin:20px auto;background:radial-gradient(#cfe9ff,#9fd6b4);animation:breathe 8s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.6)}50%{transform:scale(1.1)}}
.syls{display:flex;direction:ltr;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;margin:14px 0 4px}
.syl{font-family:Verdana,Arial;font-size:2.4em;font-weight:bold;background:#fff8ec;border:3px solid var(--line);border-radius:16px;padding:4px 14px 2px;color:var(--ink);display:flex;flex-direction:column;align-items:center;line-height:1.15}
.syl.st{color:var(--focus);border-color:#f0b0a0;font-size:2.9em}
.syl.sc{color:#7d7366;font-style:italic;background:#f4efe6}
.syl small{font-size:.3em;color:var(--soft);font-family:"Segoe UI",Arial;font-style:normal;margin-top:2px}
.syldot{font-size:2em;color:var(--lock)}
.wbar{border-radius:14px;padding:6px 14px;margin:26px 0 8px;font-weight:bold;font-size:1.05em}
/* ===== מפת אוצר ועמוד בית ===== */
.welcome .bubble{font-size:1.05em}
.btn.big{font-size:1.25em;padding:16px 30px}
.mapwrap{background:#fff;border:3px solid var(--line);border-radius:28px;padding:10px;margin:14px 0;text-align:center}
.tmap{width:100%;max-width:900px;height:auto;display:block;margin:0 auto}
.mstn{cursor:pointer}
.mstn:hover circle,.mstn:focus circle{filter:brightness(1.06)}
.mstn:hover{transform-box:fill-box}
.pulse{animation:pulseR 1.8s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulseR{50%{opacity:.25;transform:scale(1.15)}}
.hometiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
@media (max-width:560px){.hometiles{grid-template-columns:repeat(2,1fr)}}
.htile{background:#fff;border:3px solid var(--line);border-radius:22px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);font-size:1.05em}
.htile span{font-size:2.4em;line-height:1.1}
.htile:hover{border-color:var(--accent)}
.sthead{display:flex;gap:18px;align-items:center}
.bigdot{width:110px;height:110px;flex-shrink:0;border-radius:50%;background:#fff4e2;border:6px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:3em}
.howbox{background:#fff;border:3px solid rgba(0,0,0,.08);border-radius:20px;padding:14px 18px;margin:14px 0}
.howbox h3{margin:0 0 8px}
.tulibox{display:flex;gap:14px;align-items:center;background:#f3fbef;border-color:#bfe3b0}
/* ===== מפת המסע ===== */
.guide summary{cursor:pointer;font-size:1.15em;padding:4px 0}
.gitems p{margin:10px 0}
.glist{margin:6px 0 10px;padding-right:22px}
.glist li{margin:6px 0}
.qrow{margin-top:8px}
.maptitle{text-align:center;font-size:1.6em;margin:26px 0 6px}
.trail{position:relative;padding-bottom:6px}
.trail:before{content:"";position:absolute;right:46px;top:10px;bottom:10px;border-right:8px dashed #d9c39a;z-index:0}
.tflag{position:relative;z-index:1;margin:22px 0;background:#fff4c2;border:3px dashed #e0b400;border-radius:18px;padding:12px 18px;font-weight:bold;text-align:center;font-size:1.05em}
.tflag.start,.tflag.end{background:#fff;border-style:solid;border-color:var(--accent);font-size:1.15em}
.stn{display:flex;gap:14px;align-items:flex-start;position:relative;z-index:1;margin:20px 0}
.dot{width:100px;height:100px;flex-shrink:0;border-radius:50%;border:6px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.15);font-size:2.5em;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.dot small{font-size:.38em;font-weight:bold;color:var(--soft);margin-top:2px}
.stn.done .dot{border-color:var(--ok);color:var(--ok);font-weight:bold}
.stn.cur .dot{border-color:var(--accent);animation:glow 2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 10px rgba(224,138,46,.25)}}
.stn.future{opacity:.62}
.scard{flex:1;min-width:0;border-radius:22px;border:3px solid rgba(0,0,0,.08);padding:12px 16px}
.stn.cur .scard{border-color:var(--accent)}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;cursor:pointer}
.stitle{font-size:1.2em}
.ssub{margin-top:4px}
.here{background:var(--accent);color:#fff;border-radius:12px;padding:2px 10px;font-size:.85em;font-weight:bold;white-space:nowrap}
.donebadge{background:#d7f0e0;color:#1d5e3a;border-radius:12px;padding:2px 10px;font-size:.85em;font-weight:bold}
.soon{background:#eee6d8;border-radius:12px;padding:2px 10px;font-size:.85em}
.chev{font-size:1.2em;color:var(--soft)}
.sbody{margin-top:10px;border-top:2px dashed rgba(0,0,0,.12);padding-top:6px}
.sbody h4{margin:14px 0 6px;font-size:1.1em}
.gchips{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.gchip{background:#fff;border:3px solid var(--line);border-radius:16px;padding:10px;text-align:right;color:var(--ink);display:flex;flex-direction:column;gap:4px;font-size:.95em}
.gchip span{color:var(--soft);font-size:.9em}
.gchip.on{border-color:var(--accent);background:#fff4e2}
.fcard{background:#fffdf5;border:4px solid #f3d8ae;border-radius:24px;padding:18px;margin:10px auto;max-width:640px;box-shadow:0 4px 0 #ecd2a4}
.sboxes .chunks{gap:10px}
.sboxes .ch{border:3px solid #b8d4f5;border-radius:14px;padding:4px 10px;background:#f4f9ff}
/* ===== האותיות ===== */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;direction:ltr;margin-top:12px}
.ltl{background:#fff;border:3px solid #b8d4f5;border-radius:16px;padding:10px;font-family:Verdana,Arial;font-size:1.6em;color:var(--ink)}

  const n=cs.length; if(n<3||cs[n-1]!=="e") return [];

 "@le":{idx:cs=>{const n=cs.length; return (n>2&&cs[n-2]==="l"&&cs[n-1]==="e")?[n-2,n-1]:[];}, hl:"le(?=[^a-z]*$)"},
 "@er":{idx:cs=>{const n=cs.length; if(cs[n-1]==="er") return [n-1]; if(n>3&&cs[n-3]==="e"&&cs[n-2]==="s"&&cs[n-1]==="t") return [n-3,n-2,n-1]; return [];}, hl:"(er|est)(?=[^a-z]*$)"},

function sufIdx(cs, re){
  const w=cs.join(""), m=w.match(re); if(!m) return [];
  const from=w.length-m[0].length, out=[]; let pos=0;
  cs.forEach((c,i)=>{ if(pos>=from) out.push(i); pos+=c.length; });
  return out;
}
function hlRe(focus){
  if(Array.isArray(focus)) return "("+focus.slice().sort((a,b)=>b.length-a.length).join("|")+")";
  return FOCUS[focus] ? FOCUS[focus].hl : focus;
}

let CUR_L=null; // השלב הפתוח עכשיו (לצלילים מיוחדים של השלב)
function chunk(word){
  const w=word.toLowerCase(), out=[]; let i=0;
  while(i<w.length){
    const m = MULTI.find(g=>w.startsWith(g,i));
    if(m){ out.push(m); i+=m.length; } else { out.push(w[i]); i++; }

/* ============ קול ============ */
let voice=null;
function pickVoice(){
  const vs = speechSynthesis.getVoices().filter(v=>/^en[-_](US|GB)/i.test(v.lang));
  voice = vs.find(v=>/natural/i.test(v.name)&&/en-US/i.test(v.lang)) || vs.find(v=>/natural/i.test(v.name)) || vs.find(v=>/en-US/i.test(v.lang)) || vs[0] || null;
}
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(t, rate, cb){
  if(!("speechSynthesis" in window)){ if(cb) cb(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang="en-US"; if(voice) u.voice=voice; u.rate = rate||0.85;
  if(cb){ let done=false; const f=()=>{ if(!done){done=true;cb();} }; u.onend=f; u.onerror=f; }
  speechSynthesis.speak(u);
}

/* ============ הקלטי את עצמך: הקלטה ואז השוואה להגייה הנכונה ============ */
let recState=null, lastRec=null, lastRecText="";
const canRec = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
function recBtn(textExpr){ return canRec ? `<button class="btn ghost" id="recb" onclick="recSelf(${textExpr})">⏺️ הקלטי את עצמך</button>` : ""; }
// מיקרופון אחד שנשאר פתוח בזמן התרגול, כדי שלא יבקשו אישור על כל הקלטה. נסגר אחרי 2 דקות בלי שימוש
let micStream=null, micTimer=null;
async function getMic(){
  clearTimeout(micTimer);
  if(micStream && micStream.active) return micStream;
  micStream = await navigator.mediaDevices.getUserMedia({audio:true});
  return micStream;
}
function releaseMicLater(){
  clearTimeout(micTimer);
  micTimer=setTimeout(()=>{ if(micStream){ micStream.getTracks().forEach(t=>t.stop()); micStream=null; } }, 120000);
}
async function recSelf(text){
  const b=document.getElementById("recb");
  if(recState){ recState.stop(); return; }
  let stream;
  try{ stream = await getMic(); }
  catch(e){ setMsg("לא קיבלתי גישה למיקרופון. צריך ללחוץ \"אפשר\" כשהדפדפן שואל.","soft"); return; }
  const mr = new MediaRecorder(stream), parts=[];
  mr.ondataavailable = e=>{ if(e.data.size) parts.push(e.data); };
  mr.onstop = ()=>{
    releaseMicLater(); recState=null;
    if(b){ b.textContent="⏺️ הקלטי את עצמך"; b.classList.remove("mic","on"); b.classList.add("ghost"); }
    if(lastRec) URL.revokeObjectURL(lastRec);
    lastRec = URL.createObjectURL(new Blob(parts,{type:mr.mimeType})); lastRecText=text;
    compareRec();
  };
  mr.start(); recState=mr;
  if(b){ b.textContent="⏹️ סיימתי"; b.classList.remove("ghost"); b.classList.add("mic","on"); }
  setMsg("🔴 מקליט... אמרי בקול, ולחצי \"סיימתי\".","");
  setTimeout(()=>{ if(recState===mr) mr.stop(); }, 3000 + text.length*150);
}
function compareRec(){
  if(!lastRec) return;
  setMsg("🔊 קודם ההגייה הנכונה...","");
  speak(lastRecText, 0.7, ()=>{
    setMsg("🎧 ועכשיו את...","");
    setTimeout(()=>{
      const a=new Audio(lastRec);
      a.onended=()=>setMsg(`נשמע אותו דבר? אם לא, נסי שוב ושימי לב לתנועה המסומנת. <button class="btn ghost" style="padding:6px 14px;font-size:.85em" onclick="compareRec()">🔁 להשוות שוב</button>`,"");
      a.play().catch(()=>setMsg("לא הצלחתי להשמיע את ההקלטה.","soft"));
    }, 400);
  });
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
// מספרים ומילים שהזיהוי נוטה לכתוב אחרת
const SAME = {"10":"ten","6":"six","2":"to","too":"to","two":"to","1":"a","penn":"pen","pin":"pin","hen":"hen","bet":"bet","fit":"fit","ham":"ham"};
const norm = s=>s.toLowerCase().replace(/[^a-z0-9' ]/g," ").split(/\s+/).filter(Boolean).map(w=>SAME[w]||w);
let micBusy=false;
function listenMic(onDone){
  if(!SR){ onDone(null); return; }
  if(micBusy) return; micBusy=true;
  const b=document.getElementById("micb"); if(b) b.classList.add("on");
  const r = new SR(); r.lang="en-US"; r.interimResults=false; r.maxAlternatives=5;
  let got=false;
  r.onresult = e=>{ got=true; onDone([...e.results[0]].map(a=>a.transcript)); };
  r.onerror = ()=>{};
  r.onend = ()=>{ micBusy=false; if(b) b.classList.remove("on"); if(!got) onDone(null); };
  try{ r.start(); }catch(e){ micBusy=false; onDone(null); }
}

/* ============ עזרים ============ */
const $app = document.getElementById("app");
const shuffle = a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function owlSay(html){ return `<div class="say"><div class="owl">🦉</div><div class="bubble">${html}</div></div>`; }
// מילים יוצאות דופן: לא מפרקים לצלילים (זה היה מטעה), אלא מסבירים איך הן נשמעות
const IRREG = {
  read:"מילה עם שתי הגיות! בהווה (לקרוא): <b>\"רִייד\"</b>, ea = i ארוכה. בעבר (קראתי): <b>\"רֶד\"</b>, בדיוק כמו red. מבינים מההקשר.",
  said:"מילה יוצאת דופן: נשמעת <b>\"סֶד\"</b>, עם e כמו ב-elephant, למרות שכתוב ai.",
  gym:"מילה יוצאת דופן: נשמעת <b>\"ג׳ים\"</b>. ה-g נשמעת כמו ג׳, וה-y כמו ה-i ב-Instagram."
};
let MAGIC_WORDS=null;
function magicWords(){
  // e קסומה: כל מילה בתבנית הזאת, מעולם ה-e הקסומה והלאה, חוץ ממילות לב (come, have...)
  if(!MAGIC_WORDS){ MAGIC_WORDS=new Set(); const add=w=>{ if(!IRREG[w] && magicIdx(chunk(w)).length) MAGIC_WORDS.add(w); };
    LEVELS.forEach(L=>{ if(L.ready && (L.focus==="@magic"||L.world>=3)){ (L.words||[]).forEach(w=>add(w[0])); (L.ladder||[]).forEach(add); (L.listen||[]).forEach(q=>q[1].forEach(add)); } }); }
  return MAGIC_WORDS;
}
function focusIdx(cs, focus){
  if(Array.isArray(focus)) return cs.map((c,i)=>focus.includes(c)?i:-1).filter(i=>i>=0);
  const F=FOCUS[focus];
  if(F&&F.idx) return F.idx(cs);
  if(F&&F.set) return cs.map((c,i)=>F.set(c)?i:-1).filter(i=>i>=0);
  return cs.map((c,i)=>c===focus?i:-1).filter(i=>i>=0);
}
function chunksHTML(word, focus, showSounds){
  if(showSounds && IRREG[word]) return `<div class="chunks"><div class="ch"><span class="l">${word}</span></div></div><div class="hint">⚠️ ${IRREG[word]}</div>`;
  const cs=chunk(word), fi=new Set(focusIdx(cs,focus)), mg=magicIdx(cs);
  const isMagic = mg.length && (focus==="@magic" || magicWords().has(word));
  if(isMagic) mg.forEach(i=>fi.add(i));
  const n=cs.length, ed = (focus==="@ed"||focus==="@sfx") && FOCUS["@ed"].idx(cs).length ? edKind(word) : null;
  const longBtn = c=>`<button class="anc" onclick="speak('${LONG[c]}',0.7)">ארוכה, כמו ב-<span class="en">${LONG[c]}</span> 🔊</button>`;
  return `<div class="chunks">${cs.map((c,i)=>{
    let hs="", silent=false;
    if(showSounds){
      const a = ANCHOR[c];
      const ov = CUR_L && ((CUR_L.wsnd && CUR_L.wsnd[word] && CUR_L.wsnd[word][c]) || (CUR_L.snd && CUR_L.snd[c]));
      if(isMagic && i===mg[0]) hs=longBtn(c);
      else if(isMagic && i===mg[1]){ hs="שקטה 🤫"; silent=true; }
      else if(ed && i===n-2){ if(ed==="id") hs="אִ"; else { hs="שקטה"; silent=true; } }
      else if(ed && i===n-1) hs = ed==="t" ? "ט" : "ד";
      else if(ov) hs=ov;
      else if(focus==="@s" && fi.has(i)) hs = c==="s" ? "ס / ז" : "אִ";
      else if(fi.has(i) && (focus==="@le"||focus==="@sfx") && c==="l" && i===n-2 && cs[n-1]==="e") hs="אֶל";
      else if(fi.has(i) && (focus==="@er"||focus==="@sfx") && c==="e" && cs[n-1]==="t") hs="אִ";
      else if(c==="c" && /^[eiy]/.test(cs[i+1]||"")) hs="ס";
      else if(c==="g" && focus==="@cg" && /^[eiy]/.test(cs[i+1]||"")) hs="ג׳";
      else if(isMagic && c==="s" && i===mg[0]+1) hs="ז";
      else if(c==="y" && i===n-1 && i>0) hs = cs.slice(0,i).some(x=>/[aeiou]/.test(x)) ? "אִי" : "אַיי";
      else if(c==="e" && i===n-1 && n>=3 && !/[aeiouy]/.test(cs[i-1])){ hs="שקטה"; silent=true; }
      else if(/^[aeiou]$/.test(c) && i===n-1 && n<=3) hs=longBtn(c);
      else if(VT[c]) hs=VT[c];
      else if(a) hs=`<button class="anc" onclick="speak('${a[0]}',0.7)">כמו ב-<span class="en">${anchorWord(a[0],c)}</span> 🔊</button>`;
      else hs = SOUND[c]||"";
    }
    return `<div class="ch${fi.has(i)?' f':''}${silent?' silent':''}"><span class="l">${c}</span><span class="hs">${hs}</span></div>`;
  }).join("")}</div>`;
}
// מילה ארוכה מחולקת להברות. ˈ = ההברה החזקה (אדומה), ° = הברה בלועה (אפורה). לחיצה על הברה משמיעה אותה
function sylHTML(s){
  const parts=s.split("·");
  return `<div class="syls">${parts.map(p=>{
    const st=p.startsWith("ˈ"), sc=p.startsWith("°"), t=p.replace(/[ˈ°]/g,"");
    const say = sc && t.length<=2 ? "uh" : t;
    return `<button class="syl ${st?"st":""} ${sc?"sc":""}" onclick="speak('${say}',0.6)">${t}<small>${st?"💪 חזקה":sc?"ə בלועה":"&nbsp;"}</small></button>`;
  }).join(`<span class="syldot">·</span>`)}</div><div class="hint">לחיצה על הברה משמיעה אותה. קוראים כל הברה, ואז מחברים.</div>`;
}
function wordHTML(L, w){ // הברות למילה ארוכה, אחרת פירוק לצלילים
  const e=(L.words||[]).find(x=>x[0]===w);
  if(e && e[2]) return sylHTML(e[2]) + (IRREG[w]?`<div class="hint">⚠️ ${IRREG[w]}</div>`:"");
  return chunksHTML(w, L.focus, true);
}
function hlWord(w, focus){ try{ return w.replace(new RegExp(hlRe(focus),"gi"), m=>`<span class="focus">${m}</span>`); }catch(e){ return w; } }
function wordsSpans(text, focus){
  return text.split(" ").map((w,i)=>{
    const clean = w.toLowerCase().replace(/[^a-z']/g,"");
    const sight = SIGHT.includes(clean);
    return `<span class="w${sight?' sight':''}" data-w="${clean}" onclick="wordTip('${clean}')">${sight?w:hlWord(w,focus)}</span>`;
  }).join(" ");
}
function setMsg(t,cls){ const m=document.getElementById("msg"); if(m){m.className="msg "+(cls||"");m.innerHTML=t;} }
function micBtn(fn,label){ return SR ? `<button class="btn mic" id="micb" onclick="${fn}">🎤 ${label||"אני קוראת"}</button>` : `<button class="btn mic" onclick="selfOk()">✔ קראתי בקול</button>`; }

function bidiT(s){ if(!/[֐-׿]/.test(s)) return `<bdi dir="ltr">${s}</bdi>`; return s.replace(/[A-Za-z_][A-Za-z_ ,'\-]*[A-Za-z_]|[A-Za-z_]/g, m=>`<bdi>${m}</bdi>`); }

/* ============ שלב ============ */
let S=null;
function startLevel(li, fresh){
  const L=LEVELS[li], steps=[{t:"rule"}]; CUR_L=L;
  L.words.forEach(w=>steps.push({t:"word",w}));
  shuffle(L.listen).forEach(q=>steps.push({t:"listen",q}));
  if(L.ladder && L.ladder.length) steps.push({t:"ladder"});
  L.reads.forEach(r=>steps.push({t:"read",r}));
  steps.push({t:"para"});
  steps.push({t:"done"});
  S={L,li,steps,i:0,tries:0,good:0,total:0};
  // ממשיכים מאיפה שעצרנו (אלא אם ביקשה מההתחלה)
  save.pos=save.pos||{};
  const p=save.pos[L.id];
  if(p && !fresh){ S.i=Math.min(p.i,steps.length-2); S.good=p.good||0; S.total=p.total||0; }
  render();
}
function next(){ S.i=Math.min(S.i+1,S.steps.length-1); render(); }
function prev(){ S.i=Math.max(0,S.i-1); render(); }
function bar(){
  const p=Math.round(100*S.i/(S.steps.length-1)), last=S.i===S.steps.length-1;
  return `<div class="progress"><div style="width:${p}%"></div></div>
   <div class="nav"><button class="small" onclick="prev()" ${S.i===0?"disabled":""}>→ הקודם</button>
   <span class="hint">${bidiT(S.L.title)} · ${S.i+1} מתוך ${S.steps.length}</span>
   <button class="small" onclick="next()" ${last?"disabled":""}>דלג ←</button></div>
   ${S.i>0&&!last?`<div class="hint"><button class="tiny" onclick="startLevel(${S.li},true)">🔁 להתחיל את השלב מההתחלה</button></div>`:""}`;
}
function savePos(){ save.pos=save.pos||{}; if(S.steps[S.i].t==="done") delete save.pos[S.L.id]; else save.pos[S.L.id]={i:S.i,good:S.good,total:S.total}; persist(); }
function score(ok){ S.total++; if(ok){ S.good++; earn(1); } }
function selfOk(){ setMsg("יופי! אפשר להקשיב 🔊 כדי לבדוק, ואז להמשיך.","good"); earn(1); }

      ${anchorsRow(L.focus, L.anchors)}

      <div class="row"><button class="btn alt" onclick="speak('${target}',0.55)">🔊 שוב</button></div>
      <div class="row">${shuffle(opts).map(o=>`<button class="opt en" onclick="pickListen(this,'${o}','${target}')">${hlWord(o,"[aeiou]")}</button>`).join("")}</div>
      <div class="msg" id="msg"></div><div class="row" id="nx"></div></div>`;

      <div class="ladder" id="lad"></div>
      <div id="ladw"></div>
      <div class="row">${micBtn("micLadder()","אני אומרת")}
      <button class="btn alt" onclick="speak(S.L.ladder[S.li2],0.6)">🔊 איך זה נשמע</button>${recBtn("S.L.ladder[S.li2]")}
      <button class="btn" onclick="ladderNext()">הבא ←</button></div>

      <div class="row">${micBtn(`micText('txt')`)}

      <div class="row"><button class="btn" onclick="next()">הבא ←</button></div></div>`;
  }
  else if(st.t==="para"){

      <div class="text en para" id="para"></div>

/* ============ בדיקת הגייה ============ */
function heardSet(alts){ return new Set(alts.flatMap(norm)); }
function micWord(w){
  setMsg("מקשיב... 👂 אמרי את המילה");
  listenMic(alts=>{
    if(!alts){ setMsg("לא שמעתי. לחצי שוב על 🎤 ודברי קרוב למחשב.","soft"); return; }
    const ok = heardSet(alts).has(w);
    S.tries++;
    if(ok){ score(true); setMsg("שמעתי בדיוק! 🌟","good"); }
    else {
      if(S.tries===1) score(false);
      setMsg(S.tries<2
        ? `שמעתי משהו כמו "<span class="en">${alts[0]}</span>". נסי שוב, צליל אחרי צליל.`
        : `בואי נקשיב יחד 🔊 ואז תחזרי אחריי.`, "soft");
      if(S.tries>=2) speak(w,0.55);
    }
  });
}
function micText(id){
  setMsg("מקשיב... 👂 קראי בקול");
  listenMic(alts=>{
    if(!alts){ setMsg("לא שמעתי. לחצי שוב על 🎤.","soft"); return; }
    const heard=heardSet(alts), box=document.getElementById(id); let g=0,a=0;
    box.querySelectorAll(".w").forEach(sp=>{
      const w=sp.dataset.w; if(!w) return; a++;
      sp.classList.remove("ok","tryw");
      if(heard.has(w)){sp.classList.add("ok");g++;} else sp.classList.add("tryw");
    });
    S.tries++; if(S.tries===1) score(g===a);
    setMsg(g===a?"קראת את כל המילים! 🌟"
      :`${g} מתוך ${a} מילים נשמעו ברור. לחצי על המילים הכתומות כדי לשמוע אותן, ונסי שוב.`, g===a?"good":"soft");
  });
}
function pickListen(b,o,t){
  if(o===t){ b.classList.add("right"); if(!S.tries) score(true); setMsg("נכון! 🌟","good"); document.getElementById("nx").innerHTML=`<button class="btn" onclick="next()">הבא ←</button>`; }
  else { b.classList.add("wrong"); bad(); if(!S.tries) score(false); S.tries++; setMsg(`זו <span class="en">${o}</span>. הקשיבי שוב 🔊`,"soft"); speak(t,0.5); }
}
/* ============ סולם ============ */
function drawLadder(){
  const L=S.L;
  document.getElementById("lad").innerHTML = L.ladder.map((w,i)=>{
    const prev=L.ladder[i-1]; let shown=w;
    if(prev){ shown=[...w].map((c,j)=>c!==prev[j]?`<span class="focus">${c}</span>`:c).join(""); }

let actx=null;
function tone(seq){
  if(save.mute) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    seq.forEach(([f,t,d])=>{
      const o=actx.createOscillator(), g=actx.createGain(), now=actx.currentTime;
      o.type="sine"; o.frequency.value=f;
      g.gain.setValueAtTime(.0001,now+t); g.gain.exponentialRampToValueAtTime(.18,now+t+.02); g.gain.exponentialRampToValueAtTime(.0001,now+t+d);
      o.connect(g); g.connect(actx.destination); o.start(now+t); o.stop(now+t+d+.05);
    });
  }catch(e){}
}

// כל המילים מהשלבים שהיא כבר התחילה או סיימה (למשחקים: רק מה שכבר נלמד)
function learnedLevels(){
  const done=new Set(save.done||[]), pos=save.pos||{}, st=save.stars||{};
  const ls=LEVELS.filter(L=>L.ready && (done.has(L.id)||pos[L.id]||st[L.id]||["a","e","i"].includes(L.id)));
  return ls;
}
function learnedWords(){
  const s=new Set();
  learnedLevels().forEach(L=>{ L.words.forEach(w=>s.add(w[0])); (L.ladder||[]).forEach(w=>s.add(w)); (L.listen||[]).forEach(q=>q[1].forEach(w=>s.add(w))); });
  return s;
}
const isCVC = w => /^[^aeiou][aeiou][^aeiouy]$/.test(w);
function okGroup(g){ const s=learnedWords(); return g.every(w=>isCVC(w)||s.has(w)); }
function heOf(w){
  if(save.bankHe && save.bankHe[w]) return save.bankHe[w];
  if(window.BR && BR.t && BR.t.gl && BR.t.gl[w]) return BR.t.gl[w];
  for(const L of Object.values(window.VOCAB||{})){ const f=L.find(v=>v[0]===w); if(f) return f[1]; }
  for(const L of LEVELS){ if(L.words){ const f=L.words.find(x=>x[0]===w); if(f) return f[1]; } }
  return TWIN_HE[w] || SENT_HE[w] || "";
}
function allKnown(){ // כל המילים שהמשחק מכיר: לחיפוש לפי עברית ולמסיחים במבחן
  const m={}; LEVELS.forEach(L=>L.words&&L.words.forEach(([w,h])=>m[w]=h));
  Object.assign(m,TWIN_HE); Object.keys(SENT_HE).forEach(k=>{ if(!m[k]&&k.length>2) m[k]=SENT_HE[k]; });
  return m;
}
const bank = ()=> (save.bank = save.bank||[]);
const inBank = w => bank().some(b=>b.w===w);
function addToBank(w, he){
  w=strip(w); if(!w) return;
  if(!inBank(w)) bank().push({w, he: he||heOf(w), lvl:0});
  persist();
  document.querySelectorAll(`[data-bank="${w}"]`).forEach(b=>{ b.textContent="✓ בבנק"; b.disabled=true; });
}
// מילים שנועה ביקשה בצ'אט להכניס לבנק. נכנסות פעם אחת, ואם תמחק אותן הן לא יחזרו
const PRESET_BANK = [
  {w:"jab", he:"דקירה, מכה קצרה"},
  {w:"ham", he:"בשר חזיר"}
];
function applyPresets(){
  save.presetsDone = save.presetsDone || [];
  PRESET_BANK.forEach(p=>{
    if(save.presetsDone.includes(p.w)) return;
    if(!inBank(p.w)) bank().push({w:p.w, he:p.he, lvl:0});
    else { const b=bank().find(b=>b.w===p.w); if(!b.he) b.he=p.he; }
    save.bankHe=save.bankHe||{}; save.bankHe[p.w]=p.he;
    save.presetsDone.push(p.w);
  });
  persist();
}

function manualAdd(){
  const he=document.getElementById("bkHe").value.trim(); let en=strip(document.getElementById("bkEn").value);
  const known=allKnown();
  if(!en && he){ en = Object.keys(known).find(k=>known[k].split(/[\s,/]+/).includes(he) || known[k]===he) || ""; }
  if(!en){ setMsg(he?`לא מצאתי את "${he}" באנגלית. כתבי גם את המילה באנגלית (אפשר לשאול את תמר).`:"כתבי מילה.","soft"); return; }
  addToBank(en, he || known[en] || "");
  if(he){ save.bankHe=save.bankHe||{}; save.bankHe[en]=he; persist(); }
  showBank();
}
/* --- מבחן: מילים חדשות וחלשות מופיעות יותר; נכון = עולה רמה, טעות = חוזרת להתחלה --- */
let Q=null;
function startQuiz(){
  const b=bank(); if(!b.length){ showBank(); return; }
  const weighted=[]; b.forEach(x=>{ for(let k=0;k<4-Math.min(3,x.lvl);k++) weighted.push(x); });
  const pick=[]; shuffle(weighted).forEach(x=>{ if(!pick.includes(x) && pick.length<10) pick.push(x); });
  const types=["en2he","ear","he2en"];
  Q={items:pick.map((x,i)=>({x,t:types[i%3]})),i:0,good:0,retry:new Set()};
  drawQuiz();
}
function distractors(x,field){
  const known=allKnown(), pool=bank().filter(b=>b.w!==x.w&&b.he).map(b=>({w:b.w,he:b.he}))
    .concat(Object.keys(known).filter(k=>k!==x.w).map(k=>({w:k,he:known[k]})));
  const seen=new Set([field==="he"?x.he:x.w]); const out=[];
  shuffle(pool).forEach(p=>{ const v=p[field]; if(v && !seen.has(v) && out.length<2){ seen.add(v); out.push(v); } });
  return out;
}
function drawQuiz(){
  if(window.speechSynthesis) speechSynthesis.cancel();
  const p=Math.round(100*Q.i/Q.items.length);
  let h=`<div class="progress"><div style="width:${p}%"></div></div><div class="hint">מבחן מבנק המילים</div>`;
  if(Q.i>=Q.items.length){
    h+=`<div class="card" style="text-align:center"><div class="owl" style="font-size:4em">🦉📒</div><h2>${Q.good} מתוך ${Q.items.length}</h2>
      <p>מילים שטעית בהן חזרו להתחלה ויופיעו יותר במבחן הבא. כך הן נדבקות לאט לאט.</p>
      <div class="row"><button class="btn alt" onclick="startQuiz()">✏️ עוד מבחן</button><button class="btn ghost" onclick="showBank()">📒 לבנק</button><button class="btn" onclick="goMap()">🗺️ למפה</button></div></div>`;
    $app.innerHTML=h; return;
  }
  const {x,t}=Q.items[Q.i]; Q.tried=false;
  if(!x.he && t!=="ear") Q.items[Q.i].t="ear";
  const tt=Q.items[Q.i].t;
  if(tt==="en2he"){
    const opts=shuffle([x.he,...distractors(x,"he")]);
    h+=`<div class="card">${owlSay("קראי את המילה. <b>מה היא אומרת?</b>")}${chunksHTML(x.w,"",false)}
      <div class="row"><button class="btn alt" onclick="speak('${x.w}',0.6)">🔊</button></div>
      <div class="row">${opts.map(o=>`<button class="opt" onclick="quizPick(this,${JSON.stringify(o).replace(/"/g,'&quot;')},${JSON.stringify(x.he).replace(/"/g,'&quot;')})">${o}</button>`).join("")}</div>`;
  } else if(tt==="he2en"){
    const opts=shuffle([x.w,...distractors(x,"w")]);
    h+=`<div class="card">${owlSay(`איך אומרים באנגלית: <b>${x.he}</b>?`)}
      <div class="row">${opts.map(o=>`<button class="opt en" onclick="quizPick(this,'${o}','${x.w}')">${o}</button>`).join("")}</div>`;
  } else {
    const opts=shuffle([x.w,...distractors(x,"w")]);
    h+=`<div class="card">${owlSay("👂 הקשיבי. <b>איזו מילה שמעת?</b>")}
      <div class="row"><button class="btn alt" onclick="speak('${x.w}',0.6)">🔊 שוב</button></div>
      <div class="row">${opts.map(o=>`<button class="opt en" onclick="quizPick(this,'${o}','${x.w}')">${o}</button>`).join("")}</div>`;
    setTimeout(()=>speak(x.w,0.6),350);
  }
  h+=`<div class="msg" id="msg"></div><div class="row" id="nx"></div></div>`;
  $app.innerHTML=h; window.scrollTo(0,0);
}
function quizPick(b,o,ans){
  const it=Q.items[Q.i], x=it.x;
  if(o===ans){
    b.classList.add("right");
    if(!Q.tried){ Q.good++; x.lvl=Math.min(3,x.lvl+1); earn(1); }
    persist();
    setMsg(`נכון! 🌟 <bdi>${x.w}</bdi> = ${x.he||""}`,"good");
    document.getElementById("nx").innerHTML=`<button class="btn" onclick="Q.i++;drawQuiz()">הבא ←</button>`;
  } else {
    b.classList.add("wrong"); bad();
    if(!Q.tried){ x.lvl=0; persist(); if(!Q.retry.has(x.w)){ Q.retry.add(x.w); Q.items.push({x,t:it.t}); } }
    Q.tried=true;
    setMsg("לא בדיוק. נסי שוב. המילה הזאת תחזור בסוף המבחן.","soft");
  }
}

/* ---- כלל גורף לכל המשחקים: קודם מה שעוד לא היה. רק אחרי שעוברים על כל המאגר מתחילים מחדש,
        וגם אז מה שהיה בסיבוב האחרון לא חוזר מיד. נשמר בין פתיחות של המשחק ---- */
function freshPick(key, pool, n, idf){
  idf = idf || (x=>typeof x==="string"?x:JSON.stringify(x));
  save.seen=save.seen||{}; const seen=save.seen[key]||[];
  const fresh=pool.filter(x=>!seen.includes(idf(x)));
  if(fresh.length>=n){
    const pick=shuffle(fresh).slice(0,n);
    save.seen[key]=seen.concat(pick.map(idf)); persist(); return pick;
  }
  // המאגר נגמר: מה שנשאר חדש, ואחריו ישנים שלא היו בסיבוב האחרון
  const last=new Set(seen.slice(-n));
  const older=shuffle(pool.filter(x=>seen.includes(idf(x)) && !last.has(idf(x))));
  const recent=shuffle(pool.filter(x=>last.has(idf(x))));
  const pick=shuffle(fresh).concat(older,recent).slice(0,n);
  save.seen[key]=pick.map(idf); persist();   // מחזור חדש מתחיל
  return shuffle(pick);
}

function picWords(filter){
  const ids=new Set(learnedLevels().map(L=>L.id)), r1=ids.has("r1");
  let w=Object.keys(PIC).filter(k=>ids.has(PIC[k][1]) || (r1 && "aeiou".includes(PIC[k][1])));
  if(filter) w=w.filter(filter);
  return w;
}
function knownVowels(){ const v=learnedLevels().map(L=>L.focus).filter(f=>/^[aeiou]$/.test(f)); return v.length>=2?v:["a","e","i"]; }

/* ---- 🃏 זיכרון ---- */
let M=null;
function startMemory(){
  const ws=freshPick("memory", picWords(), 6);
  const cards=shuffle(ws.flatMap(w=>[{w,t:"w"},{w,t:"p"}]));
  M={cards,open:[],got:new Set(),moves:0,lock:false}; drawMemory();
}
function drawMemory(){
  if(M.got.size===M.cards.length/2){ gameEnd("zichrona","startMemory()",0,0,`<p>מצאת את כל הזוגות ב-${M.moves} ניסיונות.</p>`); return; }
  $app.innerHTML=gameTop("zichrona","זיכרון תמונות")+`<div class="card">${sisSay("zichrona","הפכי שני קלפים. מצאי לכל <b>מילה</b> את ה<b>תמונה</b> שלה. כשמילה נפתחת, אני אומרת אותה בקול 🔊")}
    <div class="mem" style="margin-top:16px">${M.cards.map((c,i)=>{
      const up=M.open.includes(i)||M.got.has(c.w);
      return `<button class="mcard ${up?"up":""} ${M.got.has(c.w)?"got":""}" onclick="memFlip(${i})">${up?(c.t==="w"?`<span class="en">${c.w}</span>`:`<span style="font-size:2.4em">${PIC[c.w][0]}</span>`):"🦉"}</button>`;
    }).join("")}</div><div class="msg" id="msg"></div></div>`;
}
function memFlip(i){
  const c=M.cards[i];
  if(M.lock || M.open.includes(i) || M.got.has(c.w)) return;
  M.open.push(i); if(c.t==="w") speak(c.w,0.7);
  drawMemory();
  if(M.open.length===2){
    M.moves++; const [a,b]=M.open.map(j=>M.cards[j]);
    if(a.w===b.w){ M.got.add(a.w); M.open=[]; earn(1); speak(a.w,0.7); setTimeout(drawMemory,700); }
    else { M.lock=true; setTimeout(()=>{ M.open=[]; M.lock=false; drawMemory(); },1300); }
  }
}

let MS=null;
function startMissing(){
  const ws=freshPick("missing", picWords(w=>(w.match(/[aeiou]/g)||[]).length===1 && !/e$/.test(w)), 8);
  MS={ws,i:0,good:0,tried:false}; drawMissing();
}
function drawMissing(){
  if(MS.i>=MS.ws.length){ gameEnd("otiya","startMissing()",MS.good,MS.ws.length); return; }
  const w=MS.ws[MS.i], v=w.match(/[aeiou]/)[0], k=w.indexOf(v);
  const kv=knownVowels(), opts=shuffle([v,...shuffle(["a","e","i","o","u"].filter(x=>x!==v && (kv.includes(x)||x==="o"||x==="u"))).slice(0,2)]);

  $app.innerHTML=gameTop("otiya","האות החסרה",MS.i,MS.ws.length)+`<div class="card">${sisSay("otiya","מה רואים בתמונה? <b>איזו תנועה חסרה באמצע?</b> אפשר לשמוע 🔊")}

    <div class="big-en" id="mw">${w.slice(0,k)}<span class="blank">&nbsp;</span>${w.slice(k+1)}</div>
    <div class="row"><button class="btn alt" onclick="speak('${w}',0.55)">🔊 הקשבה</button></div>
    <div class="row">${opts.map(o=>`<button class="opt en" style="font-size:2em;min-width:110px" onclick="missPick(this,'${o}')">${o}</button>`).join("")}</div>
    <div class="msg" id="msg"></div><div class="row" id="nx"></div></div>`;

function missPick(b,o){
  const w=MS.ws[MS.i], v=w.match(/[aeiou]/)[0], k=w.indexOf(v), made=w.slice(0,k)+o+w.slice(k+1);
  document.getElementById("mw").innerHTML=w.slice(0,k)+`<span class="blank">${o}</span>`+w.slice(k+1);
  if(o===v){ b.classList.add("right"); if(!MS.tried){MS.good++; earn(1);} speak(w,0.6); setMsg(praise()+` <bdi>${w}</bdi>, ${v} כמו ב-<bdi>${ANCHOR[v][0]}</bdi>`,"good");
    document.getElementById("nx").innerHTML=`<button class="btn" onclick="MS.i++;drawMissing()">הבא ←</button>`; }
  else { b.classList.add("wrong"); bad(); MS.tried=true; speak(made,0.6);
    const he=TWIN_HE[made]||SENT_HE[made];
    setMsg(he?`יצא <bdi>${made}</bdi>, וזו מילה אחרת: ${he}. נסי תנועה אחרת 🙂`:`יצא <bdi>${made}</bdi>. הקשיבי שוב 🔊 ונסי תנועה אחרת.`,"soft"); }
}

/* ---- 🧺 סלסלות הצלילים ---- */
let BK=null;
const BASKET_PAIRS=[["a","o"],["a","u"],["e","i"],["a","e"],["o","u"],["i","e"],["a","i"]];
function startBaskets(){
  const kv=knownVowels(); let ps=BASKET_PAIRS.filter(p=>p.every(v=>kv.includes(v))); if(!ps.length) ps=[["a","e"]];
  const pair=freshPick("bkpair", ps, 1, p=>p.join(""))[0];
  const pool=[]; LEVELS.forEach(L=>{ if(pair.includes(L.focus)) L.words.forEach(w=>{ if((w[0].match(/[aeiou]/g)||[]).length===1 && !pool.includes(w[0])) pool.push(w[0]); }); });
  PAIRS.forEach(g=>g.forEach(w=>{ if(isCVC(w) && pair.includes(vowelOf(w)) && !pool.includes(w)) pool.push(w); }));
  Object.keys(PIC).forEach(w=>{ if(isCVC(w) && pair.includes(vowelOf(w)) && !pool.includes(w)) pool.push(w); });
  const ws=shuffle(pair.flatMap(v=>freshPick("bk_"+v, pool.filter(w=>vowelOf(w)===v), 5)));
  BK={pair,ws,i:0,good:0,tried:false,got:{[pair[0]]:[],[pair[1]]:[]}}; drawBaskets();
}
function drawBaskets(){
  if(BK.i>=BK.ws.length){ gameEnd("tzlila","startBaskets()",BK.good,BK.ws.length); return; }
  const w=BK.ws[BK.i]; BK.tried=false;
  $app.innerHTML=gameTop("tzlila","סלסלות הצלילים",BK.i,BK.ws.length)+`<div class="card">${sisSay("tzlila","👂 <b>רק להקשיב</b>, בלי לראות את המילה. איזה צליל יש באמצע? שימי את המילה בסלסלה הנכונה.")}
    <div class="row"><button class="btn alt" style="font-size:1.4em" onclick="speak('${w}',0.5)">🔊 שוב</button></div>
    <div class="big-en" id="bw" style="min-height:1.3em">❔</div>
    <div class="baskets">${BK.pair.map(v=>`<button class="basket" onclick="bkPick(this,'${v}')"><div class="e">🧺</div>
      <div class="en" style="font-size:1.8em;font-weight:bold;color:var(--focus)">${v}</div><div>כמו ב-<bdi>${anchorWord(ANCHOR[v][0],v)}</bdi></div><div class="got">${BK.got[v].join(" ")}</div></button>`).join("")}</div>
    <div class="row">${BK.pair.map(v=>`<button class="anc" onclick="speak('${ANCHOR[v][0]}',0.7)">🔊 ${ANCHOR[v][0]}</button>`).join("")}</div>
    <div class="msg" id="msg"></div><div class="row" id="nx"></div></div>`;
  setTimeout(()=>speak(w,0.5),400);
}
function bkPick(b,v){
  const w=BK.ws[BK.i], ok=vowelOf(w)===v;
  document.getElementById("bw").innerHTML=hlWord(w,"[aeiou]");
  if(ok){ if(!BK.tried){BK.good++; earn(1);} BK.got[v].push(w); b.classList.add("bounce"); setMsg(praise(),"good");
    setTimeout(()=>{BK.i++; drawBaskets();},1100); }
  else { bad(); BK.tried=true; b.classList.add("shake"); setTimeout(()=>b.classList.remove("shake"),450);
    setMsg(`זו <bdi>${w}</bdi>, עם <bdi>${vowelOf(w)}</bdi> כמו ב-<bdi>${ANCHOR[vowelOf(w)][0]}</bdi>. הקשיבי 🔊 ונסי שוב.`,"soft"); speak(w,0.5); }
}

function drawBalloons(){

    <div class="sky" id="sky">${opts.map((o,i)=>`<button class="balloon" style="left:${8+i*(84/opts.length)}%;background:${BCOL[i%BCOL.length]};animation-duration:${16+i*1.7}s;animation-delay:-${3+i*3.1}s" onclick="blPop(this,'${o}')">${o}</button>`).join("")}</div>

function blPop(b,o){

  else { bad(); BL.tried=true; b.classList.add("shake"); setTimeout(()=>b.classList.remove("shake"),450); setMsg(`זה <bdi>${o}</bdi>${vowelLine(o)}. הקשיבי שוב 🔊`,"soft"); speak(o,0.55,()=>setTimeout(()=>speak(BL.t,0.5),500)); }
}

/* ---- 🧩 בונים מילה ---- */
let BW=null;
function startBuild(){ BW={ws:freshPick("build", picWords(), 7),i:0,good:0}; drawBuildInit(); }
function drawBuildInit(){
  if(BW.i>=BW.ws.length){ gameEnd("otiya","startBuild()",BW.good,BW.ws.length); return; }
  const w=BW.ws[BW.i], cs=chunk(w);
  const extra=shuffle("aeiou".split("").filter(v=>!w.includes(v))).slice(0,2);
  BW.cs=cs; BW.tiles=shuffle(cs.concat(extra).map((t,i)=>({t,id:i}))); BW.slots=cs.map(()=>null); BW.tried=false;
  drawBuild(); setTimeout(()=>speak(w,0.55),400);
}
function drawBuild(){
  const w=BW.ws[BW.i];
  $app.innerHTML=gameTop("otiya","בונים מילה",BW.i,BW.ws.length)+`<div class="card">${sisSay("otiya","🧩 שמעי את המילה, ובני אותה מהאותיות. צמד כמו <span class='en'>sh</span> נמצא על קובייה אחת. לחיצה על אות שכבר הנחת מחזירה אותה.")}
    <div class="pic">${PIC[w][0]}</div>
    <div class="row"><button class="btn alt" onclick="speak('${w}',0.5)">🔊 הקשבה</button></div>
    <div class="slots">${BW.slots.map((s,i)=>`<button class="slot ${BW.mark?BW.mark[i]:""}" onclick="bwBack(${i})">${s?s.t:""}</button>`).join("")}</div>
    <div class="ltiles">${BW.tiles.map((t,i)=>`<button class="ltile" ${BW.slots.includes(t)?"disabled":""} onclick="bwPut(${i})">${t.t}</button>`).join("")}</div>
    <div class="msg" id="msg"></div><div class="row" id="nx"></div></div>`;
}
function bwPut(i){ const t=BW.tiles[i], k=BW.slots.indexOf(null); if(k<0) return; BW.slots[k]=t; BW.mark=null; tone([[600,0,.05]]);
  if(!BW.slots.includes(null)) bwCheck(); else drawBuild(); }
function bwBack(i){ if(BW.done) return; BW.slots[i]=null; BW.mark=null; drawBuild(); }
function bwCheck(){
  const w=BW.ws[BW.i], ok=BW.slots.every((s,i)=>s.t===BW.cs[i]);
  BW.mark=BW.slots.map((s,i)=>s.t===BW.cs[i]?"good":"bad");
  drawBuild();
  if(ok){ BW.done=true; if(!BW.tried){BW.good++; earn(1);} speak(w,0.6); setMsg(praise()+` בנית <bdi>${w}</bdi>!`,"good");
    document.getElementById("nx").innerHTML=`<button class="btn" onclick="BW.done=false;BW.i++;BW.mark=null;drawBuildInit()">הבא ←</button>`; }
  else { bad(); BW.tried=true; setMsg("כמעט! הקוביות הכתומות צריכות החלפה. לחצי עליהן כדי להחזיר, והקשיבי שוב 🔊","soft"); }
}

const SL_LAD={3:11,7:15,12:20,18:26};
const SL_SNK={16:8,24:15,28:19};
let SLG=null;
function startSL(){
  // מאגר גדול: מילים מהשלבים שהתחילה, מילים עם תמונה, ומילים קצרות מהזוגות הדומים (בתנועות שכבר למדה)
  const kv=knownVowels(), set=new Set([...learnedWords()].filter(w=>w.length>=2).concat(picWords()));
  PAIRS.forEach(g=>g.forEach(w=>{ if(isCVC(w) && kv.includes(vowelOf(w))) set.add(w); }));
  const all=[...set];
  const pool=freshPick("snakes", all, Math.min(16, all.length));
  SLG={me:1,owl:1,pool,k:0,phase:"read",msg:"",read:0}; drawSL();
}
function slWord(){ const w=SLG.pool[SLG.k%SLG.pool.length]; return w; }
function slCell(n){
  const r=Math.floor((n-1)/6), c=r%2===0?(n-1)%6:5-(n-1)%6;
  const cls=SL_LAD[n]?"lad":SL_SNK[n]?"snk":n===30?"goal":"";
  const mk=SL_LAD[n]?`⬆️ ${SL_LAD[n]}`:SL_SNK[n]?`🐍 ${SL_SNK[n]}`:n===30?"🏁":"";
  const tok=(SLG.me===n?"⭐":"")+(SLG.owl===n?"🦉":"");
  return `<div class="cell ${cls}" style="grid-row:${5-r};grid-column:${c+1}">${n}<span class="mk">${mk}</span><span class="tok">${tok}</span></div>`;
}
function drawSL(){
  let panel="";
  const w=slWord();
  if(SLG.phase==="read") panel=`<div class="hint">התור שלך ⭐ קראי את המילה בקול, ואז זרקי את הקובייה.</div>
      ${chunksHTML(w, vowelOf(w), true)}
      <div class="row"><button class="btn alt" onclick="speak('${w}',0.6)">🔊 בדיקה</button>${micBtn(`slMic()`,"אני אומרת")}<button class="btn" onclick="slRoll()">🎲 קראתי, לזרוק!</button></div>`;
  else if(SLG.phase==="snake"){
    const g=(PAIRS.filter(okGroup).find(g=>g.includes(SLG.st))||[SLG.st]);
    const opts=shuffle(g.length>1?g:[SLG.st,...shuffle([...learnedWords()].filter(x=>x!==SLG.st)).slice(0,2)]);
    panel=`<div class="say"><div class="owl">🐍</div><div class="bubble"><b>נחש!</b> אבל הוא ישנוני... אם תבחרי נכון את המילה שתשמעי, הוא יירדם ולא תחליקי 😴</div></div>
      <div class="row"><button class="btn alt" onclick="speak('${SLG.st}',0.5)">🔊 שוב</button></div>
      <div class="row">${opts.map(o=>`<button class="opt en" onclick="slSnake('${o}')">${hlWord(o,"[aeiou]")}</button>`).join("")}</div>`;
    setTimeout(()=>speak(SLG.st,0.5),400);
  }
  else if(SLG.phase==="owl") panel=`<div class="hint">🦉 התור של ינשופי...</div>`;
  else if(SLG.phase==="end") panel=`<div style="font-size:3em">${SLG.me>=30?"🏆⭐":"🦉🏁"}</div><h2>${SLG.me>=30?"ניצחת! הגעת ראשונה":"ינשופי הגיע ראשון הפעם"}</h2><p>קראת במשחק ${SLG.read} מילים 💪</p>
      <div class="row"><button class="btn" onclick="gameEnd('yanshufi','startSL()',0,0)">לפרס 🎁</button></div>`;
  $app.innerHTML=gameTop("yanshufi","נחשים וסולמות")+`<div class="card">
    <div class="hint">⭐ זו את &nbsp;·&nbsp; 🦉 זה ינשופי &nbsp;·&nbsp; ⬆️ סולם מעלה &nbsp;·&nbsp; 🐍 נחש מוריד</div>
    <div class="board">${Array.from({length:30},(_,i)=>slCell(i+1)).join("")}</div>
    <div style="text-align:center;margin-top:10px"><span class="die" id="die">🎲</span></div>
    <div class="msg" id="msg">${SLG.msg}</div>
    <div style="text-align:center">${panel}</div></div>`;
}
function slMic(){ const w=slWord(); setMsg("מקשיב... 👂"); listenMic(alts=>{
  if(!alts){ setMsg("לא שמעתי. אפשר לנסות שוב, או פשוט לזרוק 🎲","soft"); return; }
  if(heardSet(alts).has(w)){ setMsg(praise()+" ועכשיו לזרוק 🎲","good"); earn(1); } else setMsg(`שמעתי "<span class="en">${alts[0]}</span>". הקשיבי 🔊, ואפשר לזרוק בכל מקרה.`,"soft"); }); }
function rollDie(cb){
  const d=document.getElementById("die"); let n=0;
  const t=setInterval(()=>{ const v=1+Math.floor(Math.random()*6); if(d) d.textContent=["⚀","⚁","⚂","⚃","⚄","⚅"][v-1]; tone([[300+v*60,0,.04]]);
    if(++n>=8){ clearInterval(t); const r=1+Math.floor(Math.random()*6); if(d) d.textContent=["⚀","⚁","⚂","⚃","⚄","⚅"][r-1]; setTimeout(()=>cb(r),350); } },90);
}
function slMove(who, steps, cb){
  let left=steps;
  const t=setInterval(()=>{ SLG[who]=Math.min(30,SLG[who]+1); left--; drawSLBoard(); tone([[500,0,.03]]);
    if(left<=0||SLG[who]>=30){ clearInterval(t); setTimeout(cb,300); } },260);
}
function drawSLBoard(){ const b=document.querySelector(".board"); if(b) b.innerHTML=Array.from({length:30},(_,i)=>slCell(i+1)).join(""); }
function slRoll(){
  SLG.read++; SLG.k++; SLG.phase="rolling"; drawSL();
  rollDie(r=>{ SLG.msg=`זרקת ${r}`; slMove("me",r,()=>slLand("me")); });
}
function slLand(who){
  const n=SLG[who];
  if(n>=30){ SLG.phase="end"; SLG.msg=""; drawSL(); if(who==="me"){ confetti(); tone(SFX.gift); } return; }
  if(SL_LAD[n]){ SLG.msg=(who==="me"?"סולם! 🎉 מטפסת ל-":"ינשופי עלה בסולם ל-")+SL_LAD[n]; SLG[who]=SL_LAD[n]; if(who==="me") tone(SFX.ok);
    drawSL(); setTimeout(()=>who==="me"?slOwlTurn():slMyTurn(),900); return; }
  if(SL_SNK[n]){
    if(who==="me"){ SLG.st=slWord(); SLG.k++; SLG.phase="snake"; SLG.msg=""; drawSL(); return; }
    SLG.msg=`ינשופי החליק בנחש ל-${SL_SNK[n]} 😅`; SLG.owl=SL_SNK[n]; drawSL(); setTimeout(slMyTurn,900); return;
  }
  who==="me"?slOwlTurn():slMyTurn();
}
function slSnake(o){
  if(o===SLG.st){ earn(1); SLG.msg="😴 הנחש נרדם! נשארת במקום. "+praise(); }
  else { bad(); SLG.msg=`המילה הייתה <bdi>${SLG.st}</bdi>. החלקת ל-${SL_SNK[SLG.me]}, לא נורא 🙂`; SLG.me=SL_SNK[SLG.me]; speak(SLG.st,0.55); }
  SLG.phase="owl"; drawSL(); setTimeout(slOwlTurn,1100);
}
function slOwlTurn(){ SLG.phase="owl"; drawSL(); setTimeout(()=>rollDie(r=>{ SLG.msg=`ינשופי זרק ${r}`; slMove("owl",r,()=>slLand("owl")); }),600); }
function slMyTurn(){ SLG.phase="read"; drawSL(); }

function giveSticker(quiet){

    const runs=BR.runs;
    h+=`<div class="card">${sisSay("zrima","<b>כל הפסקה:</b> כל משפט בשורה משלו. הפס הצהוב מראה איפה את, ואפשר להזיז אותו בכפתורים או בלחיצה על שורה. קוראים פעם אחת עם הפס ועם הקשבה, ואז עוד פעם לבד. כל קריאה חוזרת נעשית קלה יותר.")}
      <div class="rtext" id="brs">${t.s.map((x,j)=>`<span class="rsent ${j===BR.ruler?"ruler":""}" id="bs${j}" onclick="BR.ruler=${j};brRuler()">${brSpans(x[0],j*100,false,true)}</span>`).join("")}</div>

// "מה זה אומר?": אם יש פירוש, מראים אותו. אם אין, טולי עוזרת לקרוא את המילה
function meanBtn(w){ const he=heOf(w);
  return he ? `<span><button class="tiny" onclick="this.parentNode.innerHTML='${he.replace(/'/g,"")}'">מה זה אומר?</button></span>`
            : `<button class="tiny" onclick="tuliWord('${w}')">מה זה אומר? 🐛 נשאל את טולי</button>`; }
function tuliWord(w){
  closePeek(); const d=document.createElement("div"); d.className="pop";
  d.innerHTML=`<div class="card" style="max-width:640px;text-align:right;background:#fbfff8;border-color:#bfe3b0">${tuliHelpHTML({w})}
    ${heOf(w)?"":tuliSay("את הפירוש של המילה הזו עוד אין לי במילון 🙂 אבל זכרי: <b>אפשר לקרוא מילה גם בלי לדעת מה היא אומרת.</b> קודם קוראים אותה צליל אחרי צליל, ואחר כך מנחשים מההקשר של המשפט. ובמדרגה של משפט אחרי משפט יש תרגום לכל המשפט.")}
    <div class="row"><button class="btn" onclick="this.closest('.pop').remove()">תודה טולי 💚</button></div></div>`;
  d.onclick=e=>{ if(e.target===d) d.remove(); }; document.body.appendChild(d);
}
function brSentHe(part){ const clean=txPlain(part); const s=BR.t.s.find(x=>txPlain(x[0]).includes(clean)); return s?`המשפט שבו זה מופיע: ${s[1]}`:""; }
function brSay(rate){ speak(txPlain(BR.phr[BR.pi]),rate); }
function brSayLine(rate){ speak(txPlain(BR.grow.slice(0,BR.gi+1).join(" ")),rate); }
// הקראה עם הדגשה של כל מילה בזמן שהיא נשמעת
function speakHL(text, rate, spans, cb){
  if(!("speechSynthesis" in window)){ if(cb) cb(); return; }
  speechSynthesis.cancel();
  const toks=text.split(" "), starts=[]; let p=0; toks.forEach(w=>{ const i=text.indexOf(w,p); starts.push(i); p=i+w.length; });
  const mark=i=>spans.forEach((s,j)=>s.classList.toggle("hl",j===i));
  const u=new SpeechSynthesisUtterance(text); u.lang="en-US"; if(voice) u.voice=voice; u.rate=rate||0.8;
  let got=false, timer=null, k=0;
  u.onboundary=e=>{ if(e.name && e.name!=="word") return; got=true; clearInterval(timer); let i=starts.findIndex((s,j)=>e.charIndex>=s && (j===starts.length-1 || e.charIndex<starts[j+1])); mark(i); };
  const end=()=>{ clearInterval(timer); mark(-1); if(cb){ const c=cb; cb=null; c(); } };
  u.onend=end; u.onerror=end;
  u.onstart=()=>{ setTimeout(()=>{ if(!got){ // הקול לא מדווח על מילים: מדגישים לפי זמן משוער
      timer=setInterval(()=>{ mark(k); k++; if(k>toks.length) clearInterval(timer); }, Math.max(260, 420/(rate||0.8))); } }, 450); };
  speechSynthesis.speak(u);
}
function brSayHL(i,rate){ const el=document.getElementById("bs"+i); speakHL(txPlain(BR.t.s[i][0]),rate,[...el.querySelectorAll(".w")]); }
function brReadAll(rate){
  const n=BR.t.s.length; let i=BR.ruler;
  const go=()=>{ if(i>=n||BR.step!==4) return; BR.ruler=i; brRuler(); const el=document.getElementById("bs"+i);
    speakHL(txPlain(BR.t.s[i][0]),rate,[...el.querySelectorAll(".w")],()=>{ i++; if(BR.step===4) setTimeout(go,250); }); };
  go();
}
function brRuler(){ document.querySelectorAll("#brs .rsent").forEach((e,j)=>e.classList.toggle("ruler",j===BR.ruler)); const rh=document.getElementById("rulerhe"); if(rh) rh.textContent=BR.t.s[BR.ruler][1]; const el=document.getElementById("bs"+BR.ruler); if(el) el.scrollIntoView({block:"center",behavior:"smooth"}); }
function brStart(){ BR.t0=performance.now(); drawBR(); }
function brStop(){ BR.runs.push((performance.now()-BR.t0)/1000); BR.t0=0; earn(1); drawBR(); }
// מיקרופון
function brMicWord(w){
  setMsg("מקשיב... 👂");
  listenMic(alts=>{ if(!alts){ setMsg("לא שמעתי. לחצי שוב על 🎤.","soft"); return; }
    if(heardSet(alts).has(w)){ setMsg("שמעתי בדיוק! 🌟","good"); BR.okw.add(w); earn(1,true); }
    else { setMsg(`שמעתי משהו כמו "<bdi class="en">${alts[0]}</bdi>". הקשיבי 🔊 ונסי שוב.`,"soft"); bad(); } });
}
function brMarkHeard(box, alts){
  const heard=heardSet(alts); let g=0,a=0;
  box.querySelectorAll(".w").forEach(sp=>{ const w=sp.dataset.w; if(!w) return; a++; sp.classList.remove("ok","tryw"); if(heard.has(w)){ sp.classList.add("ok"); g++; } else sp.classList.add("tryw"); });
  return [g,a];
}
function brMicText(line){
  setMsg("מקשיב... 👂 קראי בקול");
  listenMic(alts=>{ if(!alts){ setMsg("לא שמעתי. לחצי שוב על 🎤.","soft"); return; }
    let box=document.getElementById("brs");
    if(BR.step===3) box=document.getElementById("bs"+BR.si);
    if(BR.step===2) box=box.querySelector(".cur");
    const [g,a]=brMarkHeard(box,alts);
    if(g===a){ setMsg("קראת את הכול! 🌟","good"); earn(1,true); }
    else { setMsg(`${g} מתוך ${a} מילים נשמעו ברור. המילים הכתומות: לחיצה עליהן משמיעה אותן.`,"soft"); if(g<a/2) bad(); } });
}
function brMicRuler(){
  setMsg("מקשיב... 👂 קראי את השורה הצהובה");
  listenMic(alts=>{ if(!alts){ setMsg("לא שמעתי. לחצי שוב על 🎤.","soft"); return; }
    const [g,a]=brMarkHeard(document.getElementById("bs"+BR.ruler),alts);
    if(g===a){ setMsg("שורה שלמה! 🌟 עוברים לשורה הבאה.","good"); earn(1,true); if(BR.ruler<BR.t.s.length-1){ BR.ruler++; setTimeout(brRuler,700); } }
    else setMsg(`${g} מתוך ${a} מילים נשמעו ברור.`,"soft"); });
}
// שאלת בדיקה קטנה אחרי משפט
function brSentNext(){
  const s=BR.t.s[BR.si], c=s[2];
  if(c && !BR.asked[BR.si]){
    const opts=shuffle(c[1].map((o,i)=>[i,o]));
    document.getElementById("chk").innerHTML=`<div class="card" style="background:#f6fbff;border-color:#c9def5"><span class="qtype">בדיקה קטנה</span>${sisSay("zrima",c[0])}
      <div class="row">${opts.map(([i,o])=>`<button class="opt" onclick="brChk(this,${i})">${o}</button>`).join("")}</div></div>`;
    document.getElementById("nav3").style.display="none";
    document.getElementById("chk").scrollIntoView({block:"center",behavior:"smooth"});
    return;
  }
  if(BR.si<BR.t.s.length-1){ BR.si++; drawBR(); } else brNextStep();
}
function brChk(b,i){
  const c=BR.t.s[BR.si][2];
  if(i===c[2]){ b.classList.add("right"); BR.asked[BR.si]=true; earn(1); setMsg(praise()+" ההבנה נשארת איתך גם במשפט 🌟","good"); setTimeout(brSentNext,900); }
  else { b.classList.add("wrong"); b.disabled=true; bad(); setMsg(`רמז: ${BR.t.s[BR.si][1]}`,"soft"); }
}
function brPick(b,i){
  const q=BR.t.q[BR.qi];
  const ok = q[3]<0 || i===q[3];
  if(ok){ b.classList.add("right"); if(!BR.tried){ BR.good++; earn(1); } BR.total++;
    setMsg(q[3]<0?"תודה ששיתפת! בשאלות דעה כל תשובה נכונה 💚":praise(),"good");
    document.querySelectorAll(".opt").forEach(o=>o.disabled=true);
    document.getElementById("nx").innerHTML=`<button class="btn" onclick="BR.qi++;drawBR()">${BR.qi===BR.t.q.length-1?"סיום ←":"השאלה הבאה ←"}</button>`; }
  else { b.classList.add("wrong"); b.disabled=true; if(!BR.tried) BR.total++; BR.tried=true; bad();
    setMsg("לא בדיוק. אפשר להציץ בטקסט 📖 ולחפש את המשפט שמדבר על זה.","soft"); }
}
function brFinish(){
  save.tx=save.tx||{}; const first=!save.tx[BR.id];
  save.tx[BR.id]={n:((save.tx[BR.id]||{}).n||0)+1, best:BR.runs.length?Math.min(...BR.runs,(save.tx[BR.id]||{}).best||1e9):(save.tx[BR.id]||{}).best||0};
  persist(); if(first) earn(3,true);
  const mw=maxWorld(), nxt=(window.TEXTS||[]).find(x=>x.w<=mw && !txDone(x.id));
  gameEnd("zrima",`startText('${BR.id}')`,BR.good,BR.t.q.filter(q=>q[3]>=0).length,
    `<p>${first?"+3 ⭐ על טקסט חדש שקראת עד הסוף! ":""}קראת ${BR.t.s.length} משפטים. 🌿</p>${nxt?`<div class="row"><button class="btn alt" onclick="startText('${nxt.id}')">📖 לטקסט הבא: <bdi>${nxt.t}</bdi></button><button class="btn ghost" onclick="showBridge()">📚 כל הטקסטים</button></div>`:`<div class="row"><button class="btn ghost" onclick="showBridge()">📚 כל הטקסטים</button></div>`}`);
}

function chState(c){
  if(c.future) return "future";
  if(c.kind==="letters"){ const n=(save.letters||[]).length; return n>=26?"done":n?"started":"new"; }
  if(c.adv){ const tx=(window.TEXTS||[]).filter(t=>t.w===c.w), d=tx.filter(t=>txDone(t.id)).length, lw=vocabKnown(c.id);
    return (d===tx.length && lw>=25)?"done":(d||lw)?"started":"new"; }
  const ls=chLevels(c); const done=ls.filter(([L])=>(save.stars[L.id]||0)>0).length;
  return done===ls.length?"done":(done||ls.some(([L])=>(save.pos||{})[L.id]))?"started":"new";

const NW={C:"bcdfghjklmnprstvz".split(""),V:"aeiou".split(""),D1:["sh","ch","th","wh"],D2:["sh","ch","th","ck","ng","ll","ss","ff"],
  B1:["bl","cl","fl","gl","pl","sl","br","cr","dr","fr","gr","pr","tr","sk","sm","sn","sp","st","sw"],B2:["nd","nt","mp","st","sk","lk","ft"],
  T:["ee","ea","ai","oa","oo","igh"],R:["ar","or","er","ir","ur"],SUF:["ing","ed","er","y"]};
const NW_LV=[{n:"תנועות קצרות",ex:"zop, mib"},{n:"צמדים",ex:"shom, vack"},{n:"צירופים",ex:"blim, sprand"},{n:"e קסומה",ex:"bape, tike"},{n:"צמדי תנועות",ex:"meep, joam"},{n:"r",ex:"varp, tirn"},{n:"מילים ארוכות",ex:"mibton, plimming"}];

const NW_BLOCK=new Set(["fuk","fuc","sht","dik","dic","cok","cum","tit","fag","nig","gay","sex","pis","pus","ass","cuk"]);
function nonsense(lv){
  const C=()=>rnd(NW.C), V=()=>rnd(NW.V);
  switch(lv){
    case 0: return C()+V()+C();
    case 1: return Math.random()<.5 ? rnd(NW.D1)+V()+C() : C()+V()+rnd(NW.D2);
    case 2: return Math.random()<.5 ? rnd(NW.B1)+V()+C() : C()+V()+rnd(NW.B2);
    case 3: return C()+rnd(["a","i","o","u"])+C()+"e";
    case 4: return C()+rnd(NW.T)+(Math.random()<.7?C():"");
    case 5: return C()+rnd(NW.R)+C();
    default: return (C()+V()+C())+(Math.random()<.5?(C()+V()+rnd(["n","t","d","m"])):rnd(NW.SUF));
  }
}

}

/* ---- ⛓️ שרשרת מילים: מחליפים אות אחת ---- */
function chainPairs(){
  const ws=[...new Set([...learnedWords(),...Object.keys(PIC),...Object.keys(TWIN_HE)])].filter(w=>/^[a-z]{3,4}$/.test(w));
  const set=new Set(ws), pairs=[];
  ws.forEach(a=>ws.forEach(b=>{ if(a<b && a.length===b.length){ let d=0; for(let i=0;i<a.length;i++) if(a[i]!==b[i]) d++; if(d===1) pairs.push([a,b]); } }));
  return {pairs,set};
}
function startChain(){
  const {pairs,set}=chainPairs();
  const items=freshPick("chain",pairs,8,p=>p.join("-")).map(p=>{ const [a,b]=Math.random()<.5?p:[p[1],p[0]];
    const k=[...a].findIndex((c,i)=>c!==b[i]);
    const others=[...set].filter(x=>x!==b&&x!==a&&x.length===a.length&&[...x].filter((c,i)=>c!==a[i]).length===1);
    const fake=[]; "abcdefghijklmnopqrstuvwxyz".split("").forEach(c=>{ const f=a.slice(0,k)+c+a.slice(k+1); if(f!==a&&f!==b) fake.push(f); });
    const opts=[...new Set([b,...pickN(others,2),...pickN(fake,5)])].slice(0,4);
    return {show:`<div class="big-en">${a}</div><p>🔊 החליפי <b>אות אחת</b> ב-<bdi class="en">${a}</bdi> כדי לקבל את המילה ששמעת. איזו מילה זו?</p>`,
